name: kafka-ecommerce

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: user-service
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/ecommerce?currentSchema=user_service
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: order-service
    environment:
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/ecommerce?currentSchema=order_service
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8081
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      user-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: inventory-service
    environment:
      SERVER_PORT: 8083
      DATABASE_URL: jdbc:postgresql://postgres:5432/ecommerce?currentSchema=inventory_service
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: payment-service
    environment:
      SERVER_PORT: 8084
      DATABASE_URL: jdbc:postgresql://postgres:5432/ecommerce?currentSchema=payment_service
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  postgres-data:
